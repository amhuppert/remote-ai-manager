version: 1
plan_id: graph-workflow-improvements
title: Graph Workflow Improvements
last_updated: 2026-06-24
summary: >
  Implement the finalized Graph Workflow improvement proposal: alignment as
  engine invariants (charter, contracts, typed deliverables), a stronger
  validation economy (ESCALATE verdicts, adversarial verify, integration sweep,
  lenses), friction/reliability fixes (pre-flight, failure taxonomy, resume),
  and audited dynamic structure (typed graph-mutation proposals, expansion
  nodes, conditional edges, review/remediation subgraphs). Every dynamic feature
  follows "agents propose typed data; the engine applies under policy and logs
  it," preserving determinism, auditability, and human-reviewable plans.
estimate_unit: points
references:
  - label: Graph Workflow Improvement Proposal
    href: docs/reports/graph-workflow-improvement-report.md
  - label: Spec — workflow-parameterization
    href: .kiro/specs/workflow-parameterization/requirements.md
  - label: Spec — global-workflow-templates
    href: .kiro/specs/global-workflow-templates/requirements.md

lanes:
  - id: alignment
    label: Agent Alignment
    description:
      Shared contracts and source-of-truth so implementers and validators
      resolve conflicts identically.
  - id: quality
    label: Output Quality & Validation
    description:
      Validator verdicts, adversarial verification, lenses, integration
      sweep, spec lint.
  - id: friction
    label: Friction & Reliability
    description:
      Pre-flight, failure taxonomy, resume, script-validator hardening,
      gate ergonomics.
  - id: dynamic
    label: Dynamic Structure
    description:
      Typed graph-mutation proposals, expansion nodes, conditional edges,
      review/remediation subgraphs.
  - id: parallelism
    label: Parallelism
    description:
      File-ownership maps and registration points to remove shared-file
      contention.
  - id: crosscutting
    label: Cross-cutting
    description: Budgets, tiered validation, retrospectives, UI legibility.
  - id: reuse
    label: Reusability & Templates
    description:
      Parameterized definitions and a cross-project template library so a
      workflow is authored once and launched many times.

work_items:
  # ── Part 1 — Alignment ────────────────────────────────────────────────
  - id: charter
    title: Workflow Charter + source-of-truth hierarchy
    summary: >
      First-class versioned charter (mission, architecture/ownership map,
      conventions, non-goals, vocabulary, test strategy) containing an explicit
      source-of-truth precedence list, injected into every implementer and
      validator prompt; optional acknowledge_artifact receipt for high-authority
      sections.
    lane: alignment
    status: done
    priority: p1
    depends_on: []
    tags: [alignment, shared-documents, agent-prompt, validation]
    estimate: 5
    deliverables:
      - Reserved kind "charter" in the shared-documents registry
      - Source-of-truth precedence list carried in the charter
      - Prompt-digest + full-artifact injection (implementer + validator)
      - acknowledge_artifact MCP tool (high-authority artifacts only)
    notes: >
      Report §1.1 + §1.2. The precedence list lives in the charter; both inject
      into every prompt. Builds on shared-documents.ts + iteration-prompt.ts.

  - id: typed-contracts
    title: Typed deliverables + contract immutability
    summary: >
      Contexts declare machine-readable deliverables (file globs, exported
      symbols, runnable commands) and produced contract files; deterministic
      completion and contract-freeze (git-hash) checks run before agent
      validation; extracted signatures inject into dependents; plus a
      behavior->test->AC->source traceability matrix and TDD evidence on
      complete_task for rigor contexts.
    lane: alignment
    status: planned
    priority: p1
    depends_on: []
    tags: [alignment, deterministic, validation]
    estimate: 8
    deliverables:
      - deliverables + produces.contracts blocks on the resolved context schema
      - Deterministic existence/tsc/exit-code completion check
      - Contract git-hash freeze check (mayAmendContracts to override)
      - Extracted-signature injection into dependent prompts
      - Test-plan matrix artifact + validator satisfaction check
    notes: >
      Report §1.3 + §1.4. Both rely on declared produced files and the same
      git-diff check; extends the land-gate machinery and runs with the script
      gate.

  - id: completion-reports
    title: Completion reports + decision log
    summary: >
      Schema-forced per-context completion report (deliverables, deviations,
      warnings, evidence) injected into dependents, plus a record_decision tool
      and per-execution decision log; propose_decision_change routes challenges.
    lane: alignment
    status: ready
    priority: p0
    depends_on: []
    tags: [alignment, agent-tool, observability]
    estimate: 3
    deliverables:
      - Completion-report schema + execution-logger event
      - record_decision / propose_decision_change MCP tools
      - Decision-log injection into downstream prompts
    notes:
      Report §1.5. Foundation for gate digest, integration sweep, conditional
      edges.

  - id: shared-rubric
    title: Shared validator rubric
    summary: >
      Render the validator's AC-derived checklist once at seed time and show the
      same checklist to both implementer and validator.
    lane: alignment
    status: future
    priority: nice_to_have
    depends_on: []
    tags: [alignment]
    estimate: 2
    notes: Report §1.6. Optional alignment refinement.

  # ── Part 2 — Quality & Validation ─────────────────────────────────────
  - id: spec-lint
    title: Spec lint at planning time
    summary: >
      Deterministic checks run by create/replace_graph_workflow: referenced
      paths exist, scriptValidator implies preMergeCommand, init script exists,
      formula-restatement warning, prompt-size overflow warning, ownership
      overlap, produce/consume and naming conflicts.
    lane: quality
    status: ready
    priority: p0
    depends_on: []
    tags: [deterministic, planner, friction]
    estimate: 3
    deliverables:
      - Definition-accept-time lint in the create/replace handlers
    notes: Report §2.7. Highest leverage-to-effort item; catches config bugs at
      create time.

  - id: validator-trust
    title: Trustworthy validator findings (ESCALATE + adversarial verify)
    summary: >
      Add ESCALATE (structured reason) to the validator verdict, routing to the
      human gate, plus an implementer appeal_validation path; and before
      reopening on a NO-GO, spawn a cheap skeptic to refute the finding against
      the sources of truth, built by extending the collaboration cross-review /
      counter-proposal slice.
    lane: quality
    status: planned
    priority: p1
    depends_on: [charter]
    tags: [validation, agent-tool, approval-gate, collaboration]
    estimate: 5
    deliverables:
      - GO/NO-GO/ESCALATE verdict + reason in codex-agent-schemas.ts
      - appeal_validation tool + severity routing
      - Pre-reopen adversarial verification on src/lib/workflows/collaboration
    notes: >
      Report §2.1 + §2.2. Both make validator findings trustworthy and both rely
      on the declared source hierarchy (now in the charter).

  - id: validator-lenses
    title: Validator ensembles + reality-check lens
    summary: >
      Per-context validation as an ensemble of lenses (acceptance, integration,
      type-safety, test-quality, reality-check); the reality-check lens judges
      against the real domain and reports spec smells as advisory gate findings.
    lane: quality
    status: planned
    priority: p2
    depends_on: []
    tags: [validation, quality]
    estimate: 5
    deliverables:
      - lenses/validators[] field on validator config
      - reality-check lens (advisory, never NO-GO)
    notes: Report §2.3. Only mechanism that could catch prototype-inherited defects.

  - id: integration-sweep
    title: Integration sweep context type
    summary: >
      Built-in global sweep context whose prompt auto-generates from upstream
      completion reports + deliverables + decision log; pins its review commit;
      can spawn remediation contexts instead of only reopening a task.
    lane: quality
    status: planned
    priority: p1
    depends_on: [completion-reports, typed-contracts]
    tags: [validation, quality]
    estimate: 5
    notes: Report §2.4. Makes the ad hoc final-verification pattern first-class;
      pins the review target.

  - id: diff-scoped-validation
    title: Diff-scoped validation
    summary: >
      Give the validator the context's exact commit range and review the diff
      against the AC, exploring the wider tree only as needed.
    lane: quality
    status: planned
    priority: p1
    depends_on: []
    tags: [validation, token-economy]
    estimate: 2
    notes: Report §2.5. Cuts validator tokens; per-context commits already exist.

  - id: quality-profiles
    title: Quality profiles
    summary: >
      Named, reusable quality bars (e.g. interactive-frontend-app) that the
      planner uses to generate contexts/validators and the integration sweep
      uses to decide whether evidence is complete; advisory, not hard gates.
    lane: quality
    status: planned
    priority: p1
    depends_on: []
    tags: [quality, planner]
    estimate: 3
    notes: Report §2.6. Makes the quality bar a declared artifact, not planner recall.

  # ── Part 3 — Friction & Reliability ───────────────────────────────────
  - id: preflight-probe
    title: Pre-flight environment probe + config inference
    summary: >
      Before scheduling any context, verify init script, preMergeCommand, git,
      reference paths, and dev-server startup; when dev-server config is
      missing, infer a candidate from package.json and propose it via a gate.
    lane: friction
    status: ready
    priority: p0
    depends_on: []
    tags: [reliability, friction, deterministic]
    estimate: 5
    deliverables:
      - Pre-flight probe with precise halt diagnostics
      - devServers config inference + approval-gated apply
    notes:
      Report §3.1. Prevents run-1-style config write-offs and ensure_dev_server
      noise.

  - id: failure-taxonomy
    title: Failure taxonomy (infrastructure vs agent)
    summary: >
      Classify provisioning/git/merge/recovery/dev-server errors as
      infrastructure -> immediate halt-with-diagnostic; only agent/validation
      failures consume iterations and feed the circuit breaker.
    lane: friction
    status: ready
    priority: p0
    depends_on: []
    tags: [reliability]
    estimate: 3
    notes: Report §3.2. Single highest-impact reliability fix; stops the
      21-zombie-iteration class.

  - id: revision-resume
    title: Mid-flight revision + prefix-preserving resume
    summary: >
      Edit the pending subgraph at a halt/gate while completed contexts stay
      immutable; resume from the completed prefix; every accepted edit bumps the
      working-definition revision with a recorded diff.
    lane: friction
    status: planned
    priority: p2
    depends_on: []
    tags: [dynamic, reliability]
    estimate: 5
    deliverables:
      - Pending-subgraph editing in runtime-edits.ts
      - Prefix-preserving resume + working-definition revision diffs
    notes: Report §3.3. Foundation for the dynamic-structure lane.

  - id: script-validator-defaults
    title: Script validator safe defaults
    summary: >
      Default scriptValidator.command to preMergeCommand, validate at accept
      time, and require explicit confirmation when an edit disables the
      deterministic gate across contexts.
    lane: friction
    status: ready
    priority: p0
    depends_on: []
    tags: [reliability, friction]
    estimate: 2
    notes: Report §3.5. Makes the lazy path the correct path.

  - id: validator-transcripts
    title: Retain validator transcripts
    summary: >
      Persist full agent-validator transcripts alongside each context's
      validation.jsonl, not just the final verdict JSON.
    lane: friction
    status: done
    priority: p0
    depends_on: []
    tags: [friction, observability]
    estimate: 1
    notes: >
      Report §3.6. Implemented as contexts/<ctx>/validation-transcript.jsonl
      (begin-marker + per-item events) for both codex (turn.items) and claude
      (SDK message stream); codex previously discarded turn.items entirely.
      Actual cost ~3pts (data was discarded at the SDK boundary, not merely
      unwritten), threaded through AgentTaskResult → AgentCallResult →
      PromptActorResult → TaskRunResult → validator-runner.

  - id: gate-and-steering
    title: Approval-gate ergonomics + steering channel
    summary: >
      Gate digest (diff stat + completion report + verdict + decisions),
      approve-with-comments steering, gate-pending notifications, batch
      approval, and placement guidance; plus a no-halt steering channel to
      append notes to any pending context's seed prompt.
    lane: friction
    status: planned
    priority: p0
    depends_on: [completion-reports]
    tags: [friction, approval-gate, alignment]
    estimate: 5
    deliverables:
      - Gate digest assembly
      - Approve-with-comments + no-halt pending-context steering injection
      - Notifications + batch approval
    notes: >
      Report §3.7 + §3.8. §3.8 reuses §3.7's approve-with-comments path. The
      digest is the p0 part; the standalone steering channel is lower urgency.

  # ── Part 4 — Dynamic Structure ────────────────────────────────────────
  - id: liveness-policy
    title: Liveness policy for every fan-out
    summary: >
      Batch policy { timeoutMs, minSuccessfulContexts, onTimeout,
      requiredDimensions } applied to all parallel batches (expansion, review,
      design lenses) on top of the lane/join machinery.
    lane: dynamic
    status: planned
    priority: p2
    depends_on: []
    tags: [dynamic, reliability]
    estimate: 5
    deliverables:
      - Batch-policy fields + per-lane deadline in join-runner/lane-readiness
      - Partial-salvage + replacement-spawn paths
    notes:
      Report §4.0. Imports fan-out without the dynamic workflow's hung-barrier
      risk.

  - id: propose-context
    title: propose_graph_patch + mutability ladder
    summary: >
      Agents emit schema-validated graph-mutation proposals (add context, split,
      edges, validators, branches); the engine enforces safety invariants and
      applies under a policy envelope, recording a graph-diff artifact.
    lane: dynamic
    status: planned
    priority: p2
    depends_on: [revision-resume]
    tags: [dynamic, agent-tool]
    estimate: 8
    deliverables:
      - propose_graph_patch MCP tool
      - Patch validator + safety-rule enforcement
      - Mutability ladder (none -> ... -> full-proposal) + policy application
      - Graph-diff audit artifact per mutation
    notes: Report §4.1. The central dynamism primitive; generalizes add_task.

  - id: expansion-nodes
    title: Expansion nodes
    summary: >
      A placeholder node + context template + filler context whose completion
      report yields a validated item list; the engine instantiates one context
      per item under caps, the liveness policy, and an optional gate.
    lane: dynamic
    status: planned
    priority: p2
    depends_on: [propose-context, liveness-policy]
    tags: [dynamic]
    estimate: 5
    notes: Report §4.2. Declarative scout->fan-out; enables review-fix pipelines.

  - id: conditional-edges
    title: Conditional edges and skippable contexts
    summary: >
      Deterministic when guards over typed completion-report fields / exit codes
      / verdict categories; guard-false contexts resolve as skipped. Start with
      explicit router contexts, then native conditional edges.
    lane: dynamic
    status: planned
    priority: p2
    depends_on: [completion-reports]
    tags: [dynamic]
    estimate: 5
    deliverables:
      - when-guard evaluation in the scheduler
      - Router context + skipped state
    notes: Report §4.3. Agent sets a typed flag; engine evaluates; graph stays
      statically reviewable.

  - id: review-subgraphs
    title: Dynamic review subgraphs
    summary: >
      Templated review swarms on top of collaboration (parallel_review,
      review_then_verify, synthesis, adversarial_pair) with structured findings;
      all batches inherit the liveness policy.
    lane: dynamic
    status: planned
    priority: p2
    depends_on: [validator-trust, liveness-policy]
    tags: [dynamic, validation, collaboration]
    estimate: 5
    notes:
      Report §4.4. Generalizes per-finding verify into a durable, salvageable
      review.

  - id: remediation-subgraphs
    title: Failure routing + remediation subgraphs
    summary: >
      onFailure policy that spawns a kiro-debug-shaped diagnostic context which
      proposes retry/split/escalate; integration-sweep findings spawn scoped
      remediation contexts rather than overloading the final context.
    lane: dynamic
    status: planned
    priority: p2
    depends_on: [propose-context, integration-sweep]
    tags: [dynamic, reliability]
    estimate: 3
    notes: Report §4.5. Converts bare halts into diagnosed, gated graph changes.

  - id: readonly-exploration
    title: Read-only exploration contexts
    summary: >
      Agents add readOnly contexts (no write tools, no lane commit, artifact
      output required) that the scheduler can run aggressively in parallel.
    lane: dynamic
    status: planned
    priority: p3
    depends_on: [propose-context]
    tags: [dynamic]
    estimate: 3
    notes: Report §4.6. Investigation fan-out with no merge risk.

  - id: planner-in-loop
    title: Planner-in-the-loop restructuring
    summary: >
      At a halt/gate, invoke the __planner__ session with live execution state
      to propose a revised pending subgraph via the draft registry; human
      approves the diff; engine resumes. Includes a constrained parallelization
      advisor that requires proven disjoint ownership.
    lane: dynamic
    status: planned
    priority: p2
    depends_on: [revision-resume, propose-context]
    tags: [dynamic, planner]
    estimate: 5
    notes: Report §4.7. Re-planning as a discrete, auditable, gated event.

  # ── Part 5 — Parallelism ──────────────────────────────────────────────
  - id: ownership-map
    title: File-ownership map + spine contexts
    summary: >
      Per-context file-ownership globs enforced deterministically (same git-diff
      check as contract freeze); shared files go to a serial spine context while
      disjoint owners run in parallel lanes.
    lane: parallelism
    status: planned
    priority: p2
    depends_on: [typed-contracts]
    tags: [parallelism, deterministic]
    estimate: 3
    notes: Report §5.1. Serialize only the spine, not everything; reuses the
      contract git-diff check.

  - id: registration-points
    title: Registration points (deterministic assembly)
    summary: >
      For the "every feature edits the central registry" pattern, each context
      writes a fragment file and a deterministic script assembles the registry
      during the script-validator step.
    lane: parallelism
    status: planned
    priority: p2
    depends_on: []
    tags: [parallelism, planner]
    estimate: 3
    notes: Report §5.2. Eliminates shared-file contention by construction.

  # ── Part 6 — Cross-cutting ────────────────────────────────────────────
  - id: budgets
    title: Token and context-window budgets with policy
    summary: >
      Per-workflow / per-context token-cost budgets over existing SDK-cost
      telemetry (warn -> require gate -> skip optional contexts), plus
      context-window budget management (planning-time size estimate, a runtime
      token watch with a handoff_and_continue tool, and post-hoc overflow
      flagging). Budget state surfaces in the UI and completion reports.
    lane: crosscutting
    status: planned
    priority: p2
    depends_on: [spec-lint]
    tags: [token-economy, reliability]
    estimate: 5
    deliverables:
      - Token-cost budget policy + UI/report surfacing
      - Context-window watch + handoff_and_continue tool
    notes: >
      Report §6.1 + §3.4. Unifies cost budgets and context-window limits as one
      budget/limit policy concern; gives conditional guards something to
      condition on.

  - id: tiered-validation
    title: Tiered / risk-gated agent validation
    summary: >
      Run the agent validator selectively after deterministic gates: downgrade
      or skip on low-risk diffs, escalate to high-effort only on failure, large
      diffs, or critical contexts.
    lane: crosscutting
    status: planned
    priority: p2
    depends_on: [script-validator-defaults, typed-contracts, validator-trust]
    tags: [token-economy, validation]
    estimate: 3
    notes: Report §6.2. Recovers the ~46 min of codex spent ratifying first-try
      passes.

  - id: retrospectives
    title: Completion retrospectives -> planner feedback
    summary: >
      Auto-generate a structured retrospective at terminal (original vs final
      graph, dynamic additions, validator failures, approvals, friction, spec
      smells) stored as recommendations for review; never auto-applied.
    lane: crosscutting
    status: future
    priority: nice_to_have
    depends_on: []
    tags: [cross-cutting, learning]
    estimate: 3
    notes: Report §6.3. Closes the learning loop; this analysis is itself such a
      retrospective.

  - id: ui-legibility
    title: UI legibility for dynamic graphs
    summary: >
      Show original-vs-current graph, agent-added contexts, skipped conditional
      branches, patches awaiting approval (diff + rationale + critical path),
      acknowledged artifacts, and why a context is blocked.
    lane: crosscutting
    status: planned
    priority: p2
    depends_on: [propose-context, conditional-edges]
    tags: [cross-cutting, ui]
    estimate: 5
    notes: Report §6.4. Becomes load-bearing the moment any Part-4 dynamism ships.

  # ── Part 7 — Reusability & Templates ──────────────────────────────────
  - id: workflow-parameterization
    title: Workflow parameterization (typed launch inputs + seed-time substitution)
    summary: >
      A definition declares typed launch inputs; at start the engine validates
      supplied values, deterministically substitutes {{inputs.x}} into content
      fields and every agent-rendered charter text field before the config
      resolver runs, re-validates the concrete graph through the existing
      accept-time path, and runs the engine unchanged. Static workflows keep
      working as zero-input templates.
    lane: reuse
    status: done
    priority: p1
    depends_on: [charter]
    tags: [reuse, deterministic, planner, agent-tool, ui]
    estimate: 8
    deliverables:
      - Typed parameter-declaration block on the semantic definition (name, type
        string|text|enum, label, required, default, enum options)
      - Deterministic seed-time {{inputs.x}} substitution (content fields + all
        agent-rendered charter text), run before the config resolver
      - Accept-time {{…}} reference lint + start-time value validation +
        substituted-graph re-validation through the existing accept path
      - Bound-input snapshot persisted on the execution (round-trip durable)
      - Start API { definitionId, parameters }; generated launch form +
        parameter-declaration editor in the builder
      - start_graph_workflow MCP tool + planner/create-tool param declaration
    notes: >
      Spec .kiro/specs/workflow-parameterization. Additive — reuses the existing
      engine/scheduler/validators/charter/audit; text substitution only in v1
      (no typed config bindings), gates stay author-fixed. Live-verified GO
      2026-06-22; merged to main (2fd6a801). General primitive, no Kiro
      special-casing.

  - id: global-workflow-templates
    title: Global cross-project template library + prerequisite pre-flight
    summary: >
      A global/cross-project template tier alongside per-project definitions:
      global templates are listed and launched from any project, parameterized
      via workflow-parameterization. A deterministic start-time pre-flight
      validates a template's declared prerequisites in the target project and
      halts with a precise diagnostic — before any tokens are spent.
    lane: reuse
    status: done
    priority: p1
    depends_on: [workflow-parameterization]
    tags: [reuse, deterministic, ui, agent-tool]
    estimate: 5
    deliverables:
      - Global/cross-project template storage tier alongside project-level
        definitions (reserved key; extends storage, not a fork)
      - Cross-tier template library listing/browse + global-tier authoring/CRUD,
        launchable into the current session's project
      - Declarative prerequisite block (path | skill kinds) + deterministic
        start-time pre-flight probe with precise halt diagnostics (409
        prerequisites_unmet, itemized, before any tokens)
      - list_templates MCP tool
    notes: >
      Spec .kiro/specs/global-workflow-templates. Layers on
      workflow-parameterization; reuses the substitution/validation path
      unchanged and mirrors the dev-server pre-flight patterns. No promote/fork
      transfer flows in v1. Live-verified GO 2026-06-22; merged to main
      (9e2e06c9, 471c7ff1). General primitive, no Kiro special-casing.
