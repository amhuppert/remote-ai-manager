<!--
  The app injects --font-anybody/--font-manrope/--font-geist-mono via next/font
  in RootLayout, which Storybook never mounts — without these the font-display/
  font-body/font-mono token stacks fail var() substitution and fall back to the
  browser serif. Load the same families from Google Fonts and define the vars.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;700;800&family=Geist+Mono:wght@300..700&family=Manrope:wght@300..800&display=swap"
/>
<style>
  :root {
    --font-anybody: "Anybody";
    --font-manrope: "Manrope";
    --font-geist-mono: "Geist Mono";
  }
</style>
