version: 1
plan_id: cc-roadmap
title: Command Center Roadmap
last_updated: 2026-05-14
summary: >
  Open-ended high-level roadmap for Command Center capturing platform
  primitives, backend feature work, and UI surfaces. Intentionally
  underspecified — this is a brainstorming substrate to be rewritten into
  actionable form later.
references:
  - label: Source Roadmap
    href: ROADMAP.md

lanes:
  - id: primitives
    label: Platform Primitives
    description: Foundational capabilities that unlock multiple downstream features
  - id: backend-features
    label: Backend Features
    description: Workflow, collaboration, and orchestration features built atop primitives
  - id: ui
    label: UI
    description: User-facing surfaces — conversation, workflow visualization, multi-session

work_items:
  # ---------------- Primitives ----------------

  - id: summarization
    title: Transparent Message Summarization
    summary: >
      Per-message summaries linked to full content, accessible to agents.
      Unlocks Agent 2 context, autonomous mode efficiency, and history
      navigation.
    lane: primitives
    status: planned
    priority: p0
    depends_on: []
    tags:
      - context
      - foundation
    estimate:
      value: 5
      unit: days

  - id: ask-user-halt
    title: Ask-User Workflow Halt
    summary: >
      Mechanism allowing workflow agents to pause execution and request
      clarification from the user before resuming.
    lane: primitives
    status: planned
    priority: p0
    depends_on: []
    tags:
      - workflows
      - foundation
    estimate:
      value: 2
      unit: days

  - id: agent-to-agent-messaging
    title: Agent-to-Agent Messaging
    summary: >
      Allow agents to send messages to other agents or conversations. Underlies
      orchestration and multi-agent collaboration patterns.
    lane: primitives
    status: planned
    priority: p1
    depends_on: []
    tags:
      - foundation
      - multi-agent
    estimate:
      value: 3
      unit: days

  - id: configurable-specialized-agents
    title: Configurable Specialized Agents
    summary: >
      Per-role agent configuration covering conversation, workflow implementors,
      validators, and collaboration mode.
    lane: primitives
    status: planned
    priority: p1
    depends_on: []
    tags:
      - configuration
      - foundation
    estimate:
      value: 3
      unit: days

  - id: configurable-skills
    title: Configurable Skills
    summary: >
      MCP-style configurable skill registry; user-extensible skill set per
      project or per agent role.
    lane: primitives
    status: done
    priority: p2
    depends_on: []
    tags:
      - configuration
      - extensibility
    estimate:
      value: 3
      unit: days

  # ---------------- Backend Features ----------------

  - id: agent2-conversation-context
    title: Agent 2 Conversation Context
    summary: >
      Provide Agent 2 in collaboration mode with summarized context from the
      primary conversation.
    lane: backend-features
    status: planned
    priority: p0
    depends_on:
      - summarization
    tags:
      - collaboration
    estimate:
      value: 3
      unit: days

  - id: agent2-session-continuity
    title: Agent 2 Session Continuity
    summary: >
      Optionally continue an Agent 2 session across subsequent collaboration
      invocations rather than starting fresh each time.
    lane: backend-features
    status: planned
    priority: p1
    depends_on:
      - agent2-conversation-context
    tags:
      - collaboration
    estimate:
      value: 2
      unit: days

  - id: collab-understand-objective
    title: Collaborative Understand-Objective Mode
    summary: >
      Variation of collaboration mode tailored for clarifying and refining a
      user objective before implementation.
    lane: backend-features
    status: planned
    priority: p2
    depends_on:
      - agent2-conversation-context
      - configurable-specialized-agents
    tags:
      - collaboration
    estimate:
      value: 4
      unit: days

  - id: collab-research
    title: Collaborative Research Mode
    summary: >
      Variation of collaboration mode focused on parallel research and
      information gathering by Agent 2.
    lane: backend-features
    status: planned
    priority: p2
    depends_on:
      - agent2-conversation-context
      - configurable-specialized-agents
    tags:
      - collaboration
    estimate:
      value: 4
      unit: days

  - id: autonomous-debug-mode
    title: Autonomous Debug Mode
    summary: >
      Workflow mode that autonomously investigates and resolves bugs, escalating
      to the user via the ask-user halt when stuck.
    lane: backend-features
    status: planned
    priority: p1
    depends_on:
      - ask-user-halt
    tags:
      - autonomy
      - workflows
    estimate:
      value: 5
      unit: days

  - id: autonomous-collab-mode
    title: Autonomous Collaboration Mode
    summary: >
      Workflow mode that runs collaboration loops autonomously, halting for user
      input only when necessary.
    lane: backend-features
    status: planned
    priority: p1
    depends_on:
      - ask-user-halt
      - agent2-conversation-context
    tags:
      - autonomy
      - workflows
      - collaboration
    estimate:
      value: 5
      unit: days

  - id: project-orchestrator
    title: Project-Level Orchestrator
    summary: >
      Higher-level orchestrator that can create and dispatch sessions from
      external sources (e.g., a batch of JIRA tickets).
    lane: backend-features
    status: planned
    priority: p1
    depends_on:
      - agent-to-agent-messaging
    tags:
      - orchestration
      - autonomy
    estimate:
      value: 7
      unit: days

  - id: templatized-workflows
    title: Templatized Graph Workflow Definitions
    summary: >
      Reusable workflow templates that can be parameterized and shared across
      projects.
    lane: backend-features
    status: planned
    priority: p2
    depends_on: []
    tags:
      - workflows
      - extensibility
    estimate:
      value: 4
      unit: days

  - id: composer-mode
    title: Composer Mode
    summary: >
      Backend feature for drafting long-form documents with an agent, preserving
      structure and revision context across turns.
    lane: backend-features
    status: future
    priority: p2
    depends_on:
      - summarization
    tags:
      - composer
    estimate:
      value: 5
      unit: days

  - id: self-learning-workflows
    title: Self-Learning Workflows & Conversations
    summary: >
      Workflows that adapt over time based on prior iterations, feedback, and
      outcomes. Scope intentionally vague — will be redefined.
    lane: backend-features
    status: future
    priority: p3
    depends_on:
      - summarization
      - templatized-workflows
    tags:
      - learning
      - workflows
    estimate:
      value: 10
      unit: days
    notes: >
      Large and underspecified. Likely needs to be split into smaller items once
      the concept is sharpened.

  # ---------------- UI ----------------

  - id: view-validator-conversations
    title: View Validator Agent Conversations
    summary: >
      Surface the internal conversations of validator agents inside the graph
      workflow UI for inspection and debugging.
    lane: ui
    status: planned
    priority: p1
    depends_on: []
    tags:
      - workflows
      - observability
    estimate:
      value: 3
      unit: days

  - id: interact-with-graph-agents
    title: Direct Agent Interaction Inside Graph Workflows
    summary: >
      Allow the user to interject, direct, or correct agents mid-workflow from
      the graph UI.
    lane: ui
    status: planned
    priority: p2
    depends_on:
      - ask-user-halt
    tags:
      - workflows
    estimate:
      value: 4
      unit: days

  - id: edit-previous-message
    title: Edit Previous Message
    summary: >
      Allow the user to edit an earlier message in a conversation, creating a
      fork at that point.
    lane: ui
    status: planned
    priority: p2
    depends_on: []
    tags:
      - conversation
      - forks
    estimate:
      value: 3
      unit: days

  - id: view-message-history
    title: View / Copy Message History
    summary: >
      Browsable, copyable view of the message history for a session.
    lane: ui
    status: planned
    priority: p2
    depends_on: []
    tags:
      - conversation
    estimate:
      value: 2
      unit: days

  - id: browse-forked-conversations
    title: Hierarchical Fork Browser
    summary: >
      Make forks a first-class UX experience — browse and navigate forked
      conversations as a hierarchy.
    lane: ui
    status: planned
    priority: p2
    depends_on:
      - edit-previous-message
    tags:
      - conversation
      - forks
    estimate:
      value: 4
      unit: days

  - id: voice-context-switcher
    title: Voice Tool Project Context Switcher
    summary: >
      GUI in the voice tool to switch between project contexts.
    lane: ui
    status: planned
    priority: p3
    depends_on: []
    tags:
      - voice
    estimate:
      value: 3
      unit: days

  # ---------------- UI: Richer session panel rows ----------------

  - id: panel-row-current-action
    title: Session Row "What It's Doing Now" Line
    summary: >
      Replace time-only metadata in each session row with a one-line
      natural-language status derived from the last tool call or assistant
      message (e.g., "Writing tests for queue-route…", "Awaiting input · 3m",
      "Ran 4 bash commands"). Finder status-bar / Cursor agent strip pattern.
    lane: ui
    status: done
    priority: p1
    depends_on:
      - summarization
    tags:
      - sessions
      - panel-row
      - observability
      - 2026-05-14
    estimate:
      value: 2
      unit: days

  - id: panel-row-last-message-preview
    title: Session Row Last-Message Preview
    summary: >
      Two lines of monospace, truncated, Slack-style preview of the most recent
      message. Density toggle to switch between compact and preview row modes.
    lane: ui
    status: planned
    priority: p2
    depends_on:
      - summarization
    tags:
      - sessions
      - panel-row
      - 2026-05-14
    estimate:
      value: 2
      unit: days

  - id: panel-row-activity-sparkline
    title: Session Row Activity Sparkline
    summary: >
      Tiny 30-minute sparkline of tool-uses-per-minute per session, so at a
      glance you can tell which agents are actually working vs. stalled.
      Mission-control aesthetic.
    lane: ui
    status: planned
    priority: p2
    depends_on: []
    tags:
      - sessions
      - panel-row
      - observability
      - 2026-05-14
    estimate:
      value: 2
      unit: days

  - id: panel-awaiting-input-section
    title: Awaiting-Input Session Section
    summary: >
      Promote awaiting-input sessions into their own section at the top of the
      panel with an amber tab and count badge. Linear-inbox pattern for
      surfacing sessions that need the user.
    lane: ui
    status: planned
    priority: p1
    depends_on:
      - ask-user-halt
    tags:
      - sessions
      - panel-row
      - 2026-05-14
    estimate:
      value: 2
      unit: days

  # ---------------- UI: Multi-conversation orchestration ----------------

  - id: conversation-peek-popover
    title: Conversation Peek Hover Popover
    summary: >
      Hovering a session row opens a 400×500 floating panel showing the last ~6
      messages and a quick prompt input. Send a reply, close, and return to the
      current conversation. Gmail mouse-over preview / GitHub PR hovercard
      pattern.
    lane: ui
    status: done
    priority: p2
    depends_on: []
    tags:
      - sessions
      - multi-conversation
      - 2026-05-14
    estimate:
      value: 4
      unit: days

  - id: bridge-view
    title: Split Screen Multi-Conversation Layout
    summary: >
      New layout mode replacing the single conversation with a 2×2 or 3×2 grid
      of conversation tiles, each tailing its own stream and independently
      interactive (prompt + scroll). For the "I'm orchestrating 6 agents"
      moment. Pattern: tmux, ATC, trading desk.
    lane: ui
    status: planned
    priority: p2
    depends_on: []
    tags:
      - sessions
      - multi-conversation
      - layout
      - 2026-05-14
    estimate:
      value: 6
      unit: days

  - id: conversation-tabs
    title: Conversation Tabs Strip
    summary: >
      Thin strip of currently-open conversations across the top of the
      conversation pane — browser-tab metaphor with Cmd+1/2/3 to swap. Side
      panel is "all active"; tabs are "the few I'm actively juggling".
    lane: ui
    status: planned
    priority: p2
    depends_on: []
    tags:
      - sessions
      - multi-conversation
      - layout
      - 2026-05-14
    estimate:
      value: 3
      unit: days

  - id: focus-mode
    title: No Distractions Mode
    summary: >
      One keystroke (e.g., ⌘.) collapses the side panel entirely, dims topbar
      chrome, and suppresses toasts. Pomodoro for Command Center; inverse of
      [[bridge-view]].
    lane: ui
    status: planned
    priority: p2
    depends_on:
      - bridge-view
      - conversation-tabs
    tags:
      - layout
      - focus
      - 2026-05-14
    estimate:
      value: 2
      unit: days
